<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Browser - New Tab</title>
    <meta name="description" content="Developer-focused new tab page with quick links and productivity tools">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Background Layer -->
    <div class="background-layer" id="backgroundLayer"></div>
    <div class="background-overlay"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Top: ChatGPT, Customize, Clock -->
        <header class="header">
            <a href="https://chat.openai.com" target="_blank" class="header-box left" rel="noopener noreferrer">
                <span class="icon">🤖</span>
                <span class="text">ChatGPT</span>
            </a>

            <button class="header-box center" id="customizeToggle">
                <span class="icon">⚙️</span>
                <span class="text">Customize</span>
            </button>

            <div class="header-box right" id="clockContainer">
                <span class="time" id="timeDisplay">00:00</span>
                <span class="date" id="dateDisplay">Mon, Jan 1</span>
            </div>
        </header>

        <!-- Main Content: Thread/Mind-Map Layout -->
        <main class="main-content">
            <!-- SVG Threads - Individual curves from center to each link -->
            <svg class="threads-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
                <!-- Left Side Individual Threads -->
                <!-- Stack Overflow -->
                <path class="thread" d="M50,50 C40,40 30,25 18,15" />
                <!-- Claude -->
                <path class="thread" d="M50,50 C45,45 35,30 30,18" />
                <!-- HackerRank -->
                <path class="thread" d="M50,50 C40,48 25,40 12,32" />
                <!-- GeeksforGeeks -->
                <path class="thread" d="M50,50 C45,48 35,38 28,28" />
                <!-- LeetCode -->
                <path class="thread" d="M50,50 C35,50 20,50 10,50" />
                <!-- GitHub -->
                <path class="thread" d="M50,50 C38,55 25,60 12,64" />
                <!-- GitLab -->
                <path class="thread" d="M50,50 C40,60 28,70 18,74" />
                <!-- Netlify -->
                <path class="thread" d="M50,50 C42,52 35,55 26,56" />
                <!-- Railway (Moved near Vercel) -->
                <path class="thread" d="M50,50 C45,65 40,75 36,80" />
                <!-- Bitbucket -->
                <path class="thread" d="M50,50 C35,65 20,78 10,82" />
                <!-- Vercel -->
                <path class="thread" d="M50,50 C42,70 32,80 25,88" />

                <!-- Right Side Individual Threads -->
                <!-- MDN Docs -->
                <path class="thread" d="M50,50 C60,40 70,25 82,15" />
                <!-- Docker Hub -->
                <path class="thread" d="M50,50 C65,42 80,30 92,20" />
                <!-- Firebase Studio -->
                <path class="thread" d="M50,50 C60,45 70,35 78,25" />
                <!-- Postman -->
                <path class="thread" d="M50,50 C65,48 80,40 90,32" />
                <!-- CDN Fonts -->
                <path class="thread" d="M50,50 C60,50 70,45 75,40" />
                <!-- Image Color Picker -->
                <path class="thread" d="M50,50 C70,50 85,45 94,42" />
                <!-- URL Encoder -->
                <path class="thread" d="M50,50 C65,52 80,52 88,52" />
                <!-- JSON Formatter -->
                <path class="thread" d="M50,50 C70,55 85,60 94,62" />
                <!-- Color Palette -->
                <path class="thread" d="M50,50 C60,58 68,62 72,66" />
                <!-- CSS Gradient Generator -->
                <path class="thread" d="M50,50 C65,60 80,68 90,72" />
                <!-- Color Space -->
                <path class="thread" d="M50,50 C60,65 70,75 78,80" />
                <!-- Atternity UI -->
                <path class="thread" d="M50,50 C65,70 75,82 85,88" />
            </svg>

            <!-- Center: Title -->
            <div class="center-content">
                <h1 class="main-title" id="mainTitle" contenteditable="false" tabindex="0">DEVELOPER</h1>
                <p class="title-hint" id="titleHint">Click to edit</p>
            </div>

            <!-- Left Side Links (Generated by JS) -->
            <div class="thread-links" id="threadLinksContainer"></div>

            <!-- Right Side Links (Generated by JS) -->
            <!-- We use a single container for complexity reasons in JS, but CSS can handle it -->
        </main>

        <!-- Notepad Modal -->
        <div class="notepad-modal" id="notepadModal">
            <div class="notepad-container">
                <div class="notepad-header">
                    <h3>Quick Notes</h3>
                    <button class="notepad-close" id="notepadClose" aria-label="Close notepad">&times;</button>
                </div>
                <textarea class="notepad-textarea" id="notepadText" placeholder="Type your notes here..."></textarea>
                <div class="notepad-footer">
                    <span class="notepad-status" id="notepadStatus">Saved</span>
                </div>
            </div>
        </div>

        <!-- To Do List Modal -->
        <div class="todo-modal" id="todoModal">
            <div class="todo-container">
                <div class="todo-header">
                    <h3>To Do List</h3>
                    <button class="todo-close" id="todoClose" aria-label="Close to do list">&times;</button>
                </div>
                <div class="todo-input-wrapper">
                    <input type="text" class="todo-input" id="todoInput" placeholder="Add a new task..."
                        aria-label="Add new task">
                    <button class="todo-add-btn" id="todoAddBtn" aria-label="Add task">+</button>
                </div>
                <ul class="todo-list" id="todoList"></ul>
                <div class="todo-footer">
                    <span class="todo-count" id="todoCount">0 tasks</span>
                    <button class="todo-clear-btn" id="todoClearBtn">Clear completed</button>
                </div>
            </div>
        </div>

        <!-- Customize Links Modal -->
        <div class="bg-modal" id="customizeModal">
            <div class="bg-container" style="max-width: 800px; max-height: 80vh;">
                <div class="bg-header">
                    <h3>Customize Links</h3>
                    <button class="bg-close" id="customizeClose">&times;</button>
                </div>
                <div class="customize-content" style="overflow-y: auto; padding: 20px; max-height: 60vh;">
                    <p style="margin-bottom: 20px; color: var(--text-secondary); font-size: 0.9rem;">Edit the title and
                        URL of any link position. Positions are fixed to preserve the layout.</p>
                    <div class="links-editor-grid" id="linksEditorGrid"
                        style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                        <!-- Inputs generated by JS -->
                    </div>
                </div>
                <div class="bg-footer" style="justify-content: space-between;">
                    <button class="bg-btn secondary" id="resetLinksBtn"
                        style="background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary);">Reset
                        to Defaults</button>
                    <button class="bg-btn primary" id="saveLinksBtn"
                        style="background: var(--accent-primary); color: white; border: none;">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- Bottom: To Do List, Search Bar, Customize, Note Pad -->
        <footer class="footer">
            <button class="footer-box" id="todoToggle">To Do List</button>
            <form class="search-form" id="searchForm">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="M21 21l-4.35-4.35"></path>
                    </svg>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search with DuckDuckGo..."
                        autocomplete="off" aria-label="Search with DuckDuckGo">
                </div>
            </form>
            <button class="footer-box" id="notepadToggle">Note Pad</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>

</html>
